<!DOCTYPE html>
<html>
<head>

<title>Windows 98</title>
<link href="styles.css" rel="stylesheet" type="text/css" media="all">
<link href="/3/fonts.css" rel="stylesheet" type="text/css" media="all">

<script src="https://code.jquery.com/jquery-1.12.4.js"></script>
<script src="https://code.jquery.com/ui/1.12.0/jquery-ui.js"></script>

<script>$(function drag(){$(".draggable").draggable();});</script>


</head>
<body onload="time()">

<div id = "b-title" class = "draggable window" style="visibility:hidden;">

	<div id = "titlebar" style="width:99.8%;cursor:default;">
		<p>
			V1ntage Browser 1.0 - [ neocities.org ] - Network Neighborhood
		</p>

		<img src = "ui/x.png" style="
			position: absolute;
			top: 1px;
			left: 781px;
			width: 20px;
			cursor: pointer;
			z-index: 1;
		" onclick="nnBHide()">
	</div>

	<iframe id = "b-window" src="" width="800" height="600;">
	</iframe>

</div>

<div id = "w-error" class = "draggable window" style="cursor:default;visibility:hidden;">
	<div id = "titlebar">
		<p>
			Missing file or folder
		</p>

		<img src = "ui/x-disabled.png" style="
			position: absolute;
			top: 1px;
			left: 277px;
			width: 20px;
			cursor: pointer;
			z-index: 1;
		">

	</div>
	<img src = "ui/erroricon.png">
	<p class = "err-msg">The selected file or folder does not exist.</p>
	
	<img src = "buttons/OK.png" style="
		position: absolute;
		top: 100px;
		left: 100px;
		cursor: pointer;
		width: 100px;
	" onclick="errHide();">
</div>

<div id = "desktop-icons">
	<img src = "desktop-icons/computer.png" ondblclick="errShow()"><br><br>
	<img src = "desktop-icons/documents.png" ondblclick="errShow()"><br><br>
	
	<img src = "desktop-icons/neighborhood.png" class = "bigimage" ondblclick="nnBShow()">
	<br><br>
	
	<img src = "desktop-icons/internet.png" class = "bigimage" ondblclick="errShow()"><br><br>
	<img src = "desktop-icons/bin.png" ondblclick="errShow()" style="
		position: absolute;
		top: 320px;
		left: 17px;
	">
</div>

<div id = "start-menu" style = "visibility: hidden;">
	<div id = "smenu-content">
		
		<!>

	</div>

	<img src = "ui/sbar.png" style = "user-select: none;">
</div>

<div id = "taskbar">
	<div id = "notif">
		<p id = "clock">0:00 AM</p>
	</div>

	<img id = "start" src = "ui/start.jpg" onclick="menuShow()" style="position: fixed;">
	<img src = "ui/start-active.jpg" onclick="menuHide()"></div>
	<img class = "separator" src = "ui/separator.png">
</div>

<script src = "script.js"></script>

<script>
$('.window').click( function() {

    var topZ = 0;

    $('.window').each(function(){
        var thisZ = parseInt($(this).css('z-index'), 10);

        if (thisZ > topZ){
            topZ = thisZ;
        }
    });

    $(this).css('z-index', topZ+1);

});
</script>

</body>
</html>
