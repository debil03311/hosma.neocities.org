<!DOCTYPE html><html><head>

<title>Android 0.0 "The fuck"</title>
<script src="https://code.jquery.com/jquery-1.12.4.js"></script>

<style>

@import url('https://fonts.googleapis.com/css?family=Roboto');

body {
	-webkit-touch-callout: none;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;
    user-select: none;
	background: url('table.jpg') fixed center center no-repeat #000;
	background-size: cover;
	font-family: 'Roboto';
	font-size: 12px;
	color: #EEE;
}

#wrapper {
	position: fixed;
	top: 50%;
	left: 50%;
	transform: translate( -50%, -50% );
	cursor: default;
}

#main {
	position: absolute;
	top: 91px;
	left: 63px;
	width: 229px;
	height: 404px;
	background: url('bg.jpg') navy;
	background-size: cover;
	background-position: -268px;
	z-index: 30;
}

#box {
	position: relative;
	left: 50%;
	top: 240px;
	width: 160px;
	background: rgba( 0, 0, 0, .4 );
	text-align: center;
	border: solid 2px #EEE;
	padding: 10px;
	margin: 10px 0;
	transform: translateX( -50% );
}

#time {
	position: absolute;
	top: 60px;
	left: 22px;
}

#battery {
	position: absolute;
	top:  0;
	left: 0;
	width: 90%;
	height: 0;
	border: solid 1px #EEE;
}

#drawer {
	position: absolute;
	top:  0;
	left: 0;
	width: 100%;
	height: 100%;
	background: rgba( 0, 0, 0, .84 );
	opacity: 0;
	transition: 1s;
}

#drawer img { 
	position: relative;
	top: 12px;
	left: 8px;
	height: 40px;
	cursor: pointer;
}

#navbar {
	position: absolute;
	left:   0;
	bottom: 0;
	width: 100%;
	height: 30px;
	background: url('navbar.png') #000;
	background-size: contain;
}

#navbar span:nth-child( 1 ) {
	position: absolute;
	top: 0;
	left: 0;
	width: 144px;
	height: 100%;
	cursor: pointer;
}

#anr {
	position: fixed;
	top: 50%;
	left: 50%;
	width: 180px;
	height: 76px;
	color: #000;
	background: #FFF;
	border-radius: 4px;
	opacity: 0;
	padding: 2px 10px;
	transform: translate( -50%, -50% );
	transition: .2s;
}

button { 
	color: #01b1e5;
	font-family: 'Roboto';
	font-weight: bold;
	font-size: 12px;
	border: none;
	background: #FFF !important;
	cursor: pointer;
}

#anr button {
	position: relative;
	left: 86px;
}

</style>

</head>
<body>

<div id = "wrapper">
	<img class = "phone" src = "phone.png" height="600px">
	<div id = "main" ondblclick="$('#drawer').css( 'opacity', '1' )">
		<div id = "battery"></div>
		
		<div id = "time">
			<span class = "h" style="color: #CCC; font-weight: bold; font-size: 40px;">00</span>
			<span class = "m" style="position: relative; top: -12px; color: #AAA; font-size: 24px;">00</span>
		</div>
		
		<div id = "box">
			Current track <br>
			Sirio - Witch Hunting
		</div><div id = "box">
			<span class = "day">Sunday</span>, <span class = "date">January 1st</span>
		</div>
		
		<div id = "drawer">
			<img src = "app/clover.png"    name = "Clover">
			<img src = "app/discord.png"   name = "Discord">
			<img src = "app/fdroid.png"    name = "F-Droid">
			<img src = "app/kustom.png"    name = "KLWP">
			<img src = "app/lightning.png" name = "Lightning">
			<img src = "app/settings.png"  name = "Settings">
			<img src = "app/shuttle.png"   name = "Shuttle">
		</div>

		<div id = "anr">
			<p style="padding-left: 4px;">Unfortunately, <span class = "app">this app</span> has stopped.</p>
			<button>REPORT</button> <button>OK</button>
		</div>

		<div id = "navbar">
			<span onclick="$('#drawer').css( 'opacity', '0' )"></span>
		</div>
	</div>
</div>

<script>	// Response
$( "#drawer img" ).click( function() {
	$( "#drawer" ).css( 'opacity', '0' );
	$( "#anr" ).css( 'opacity', '1' );
	$( "#anr .app" ).text( $(this).attr("name") );
	console.log($(this).attr("name"));
});

$( "#anr button" ).click( function() {
	$( "#anr" ).css( 'opacity', '0' );
});
</script>

<script>	// Time and date
function time() {
	var dateObj = new Date();
	var yearday = dateObj.getUTCDate();
    var year    = dateObj.getUTCFullYear();

    var days    = [ 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday' ];
    var months  = [ 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December' ];

    var today = new Date();
	var h = today.getHours();
	var m = today.getMinutes();

	var day   = days[ today.getDay() ];
    var month = months[ today.getMonth() ];
	
	newdate = month + " " + yearday + ", " + year;
	m = checkTime(m);
	
	if ( m < 10 ) { m = "0" + m; }

	$( ".h" ).text( h );
	$( ".m" ).text( m );
	$( ".day" ).text( day );
	$( ".date" ).text( newdate );
}

function checkTime(i) { return i; }

setInterval(function(){ time(); },  1);
</script>

</body></html>
