<script>
var l1 = document.querySelector('.i');
var l2 = document.querySelector('.ii');

var c1 = 1;
var c2 = 1;

function toggle(leaves) {
	if ( leaves == 'i' ) {
		if ( c1 == 1 ) { l1.style.display = 'none'; c1 = 0; }
		else { l1.style.display = 'initial'; c1 = 1; }
	} else {
		if ( c2 == 1 ) { l2.style.display = 'none'; c2 = 0; } 
		else { l2.style.display = 'initial'; c2 = 1; }
	}
}
</script></body></html>
