<!DOCTYPE HTML><html><head><meta charset="utf-8"><style>

body {
	height: 100vh;
	margin: 0;

	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
}

canvas {
	border: solid 1px black;
	padding: 20px;
	margin: 10px 0;
}

input {
	width: 500px;
	padding: 4px 20px;
	margin-bottom: 10px;
	text-align: center;
}

span {
	color: blue;
	cursor: pointer;
}

</style><script src="../jquery-3.5.1.min.js"></script></head><body onload="$('input').val('');">

<canvas width="500px" height="500px" id="canvas"></canvas>
<input type="text">

<div>
	Presets:
	<span>abcdefghijklmnopqrstuvwxyz123456789.</span>,
	<span>saturn</span>,
	<span>sagittarius</span>,
	<span>abstract</span>,
	<span>millennium</span>,
	<span>3.141592653589793238462643383279</span>,
	<span>seeing is believing</span>
</div>

<script>

var p = {
	"i":["0","0"], //
	"y":["0","100"],
	"g":["0","200"],
	"m":["0","300"],
	"d":["0","400"],
	"c":["0","500"],
	"l":["100","0"], //
	"p":["100","100"],
	"5":["100","200"],
	"u":["100","300"],
	"2":["100","400"],
	"4":["100","500"],
	"s":["200","0"], //
	"q":["200","100"],
	"9":["200","200"],
	"f":["200","300"],
	"h":["200","400"],
	"n":["200","500"],
	"v":["300","0"], //
	"b":["300","100"],
	"k":["300","200"],
	"1":["300","300"],
	"z":["300","400"],
	"e":["300","500"],
	"r":["400","0"], //
	"j":["400","100"],
	"7":["400","200"],
	"o":["400","300"],
	".":["400","400"],
	"6":["400","500"],
	"3":["500","0"], //
	"x":["500","100"],
	"t":["500","200"],
	"a":["500","300"],
	"8":["500","400"],
	"w":["500","500"]
}

var canvas = document.querySelector("canvas").getContext("2d");
var word;

function draw(word) {
	canvas.clearRect(0, 0, 500, 500);

	canvas.beginPath();
	canvas.moveTo(p[ word[0] ][1], p[ word[0] ][0]);

	for (i=0;i<word.length-1;i++) {
		canvas.lineTo(p[ word[i+1] ][1], p[ word[i+1] ][0]);
	}

	canvas.stroke();
}

$("input").keydown(function(e) {
	setTimeout(function() {
		draw($("input").val().toLowerCase().replaceAll(' ',''));
	},10);
});

$("span").click(function() {
	var text = $(this).html();
	$("input").val(text);

	setTimeout(function() {
		draw(text.replaceAll(' ',''));
	},10);
});
</script></body></html>
