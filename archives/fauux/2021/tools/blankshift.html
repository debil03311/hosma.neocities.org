<!DOCTYPE HTML><html><head><meta charset="utf-8"><style>

body {
	height: 100vh;
	color: #000;
	margin: 0;

	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
}

#wrap, #shift {
	display: flex;
	flex-direction: row;
}

#wrap {	color: #000; }
#shift { margin: 40px 0; }

input {
	width: 40px;
	height: 40px;
	background: #A12;
	color: #FFF;
	font-size: 2em;
	text-align: center;
	text-transform: uppercase;
	border: solid 1px #FFF;
	margin: 0;
}

.button {
	width: 40px;
	height: 40px;
	background: none;
	color: #000;
	border: solid 1px #000;
	border-radius: 100%;
	margin: 0 40px;
	cursor: pointer;

	user-select: none;
	-moz-user-select: none;
	-webkit-user-select: none;
}

.button:active { background: #000; }

.clear { cursor: pointer; }
.clear:hover { font-weight: bold; }

</style><script src="/assets/redist/jquery-3.5.1.min.js"></script></head><body></body>

<div id = "shift">
	<div class = "button left">&nbsp;</div>
	<div id="wrap">
		<input type="text" maxlength="1">
		<input type="text" maxlength="1" style="background:#000;">
		<input type="text" maxlength="1">
		<input type="text" maxlength="1">
		<input type="text" maxlength="1">
		<input type="text" maxlength="1" style="background:#000;">
		<input type="text" maxlength="1">
		<input type="text" maxlength="1" style="background:#000;">
		<input type="text" maxlength="1">
		<input type="text" maxlength="1">
		<input type="text" maxlength="1" style="background:#000;">
		<input type="text" maxlength="1">
		<input type="text" maxlength="1">
		<input type="text" maxlength="1">
		<input type="text" maxlength="1">
		<input type="text" maxlength="1">
	</div>
	<div class = "button right">&nbsp;</div>
</div>

<span class = "clear">Clear</span>

<script>
var index;

$("input").on('keydown', function(e) {
	index = $(this).index();

	if (e.which === 8) {
		e.preventDefault();
		$(this).val("");
		$("input").eq(index-1).focus();
	} else if (e.which == 37) {
		e.preventDefault();
		setTimeout(function() {
			$("input").eq(index-1).focus();
		}, 0);
	} else if (e.which === 39) {
		setTimeout(function() {
			$("input").eq(index+1).focus();
		}, 0);
	} else if (e.which === 46) {
		return;
	} else {
		$(this).val("");
		setTimeout(function() {
			$("input").eq(index+1).focus();
		}, 0);
	}
});

$(".left").on('click', function() {
	$("input:first-child").insertAfter($("input:last-child"));
});

$(".right").on('click', function() {
	$("input:last-child").insertBefore($("input:first-child"));
});

$(".clear").on('click', function() {
	$("input").val("");
});
</script></html>
