      @font-face {
        font-family: "Noto Sans JP";
        src: url("/assets/fonts/Noto/NotoSansJP-VariableFont_wght.ttf");
      }
      
      @keyframes fadeIn {
      	from { transform: rotate(-4deg); opacity: 0; }
      	to   { transform: rotate(var(--slice-angle)); opacity: 1; }
      }
      
      @keyframes fromLeft {
      	from { opacity: 0; bottom: -100px; }
      	to   { opacity: 1; bottom: -40px; }
      }
      
      @keyframes fromRight {
      	from { opacity: 0; top: -100px; }
      	to   { opacity: 1; top: -40px; }
      }

      :root {
      	--accent: #47B897;
      	--slice-angle: -1deg;
      }
      
      body {
      	height: 100vh;
      	background: #151515;
      	font: 2em 'Noto Sans JP', sans-serif;
      	margin: 0;
      	overflow: hidden;
      
      	user-select: none;
      	-moz-user-select: none;
      	-webkit-user-select: none;
      }
      
      .hidden {
        display: none !important;  
      }
      
      #wrapper {
      	position: fixed;
      	width: 100vw;
      	height: 100vh;
      	overflow: hidden;
      
      	display: flex;
      	flex-direction: column;
      	align-items: center;
      	justify-content: space-between;
      }
      
      h1 {
      	text-align: center;
      	animation: .6s forwards;
      	animation-iteration-count: 1;
      	text-shadow: 0 0 10px #000;
      	white-space: nowrap;
      }
      
      a {
      	color: var(--accent);
      	text-decoration: none;
      	transition: letter-spacing 1s;
      }
      
      a:hover {
      	letter-spacing: .2em;
      }
      
      .top {
      	position: relative;
      	top: -40px;
      	transform: rotate( calc(180deg + var(--slice-angle)) );
      	animation: .6s;
      }
      
      .bottom {
      	position: relative;
      	bottom: -40px;
      	transform: rotate( var(--slice-angle) );
      	animation: .6s;
      }
      
      .slice {
      	width: 104vw;
      	height: 40%;
      	background: url('/assets/media/forest_green.jpg') center center;
      	background-size: cover;
      	border-top: solid 1px var(--accent);
      	box-shadow: 0 0 10px 2px #000;
      	animation-iteration-count: 1;
      }
      
      #load {
      	position: fixed;
      	top: 0;
      	left: 0;
      	width: 100%;
      	height: 100%;
      	background: #080808;
      	color: #DDD;
      	z-index: 1;
      
      	display: flex;
      	align-items: center;
      	justify-content: center;
      }
    </style>
  </head>
