<!DOCTYPE HTML>
<html>
<head>

<meta charset="UTF-8">
<meta name="description" content="Personal website about useless shit.">
<meta name="author" content="hosma">
<meta name="theme-color" content="#000000"><meta name="msapplication-navbutton-color" content="#000000">
<meta property="og:title" content="hosma.neocities">
<meta property="og:image" content="/assets/media/forest_bw.jpg">
<meta property="og:description" content="Personal website about useless shit.">

<title>It's getting darker</title>

<style>

@import url('https://fonts.googleapis.com/css?family=Herr+Von+Muellerhoff');

@keyframes glow {
	0%   {
		width: 200px;
		height: 200px;
		background: #EEE;
		box-shadow: 0 0 10px 10px #EEE;
	}
	35%  {
		width: 300px;
		height: 300px;
		background: #FFF;
		box-shadow: 0 0 20px 14px #FFF;
	}
	65%  {
		width: 300px;
		height: 300px;
		background: #FFF;
		box-shadow: 0 0 20px 14px #FFF;
	}
	100% {
		width: 200px;
		height: 200px;
		background: #EEE;
		box-shadow: 0 0 10px 10px #EEE;
	}
}

@keyframes fade {
	0%   { opacity: .2; }
	35%  { opacity: .4; }
	65%  { opacity: .4; }
	100% { opacity: .2; }
}

@keyframes core {
	0%   { opacity: .2; }
	35%  { opacity: .4; }
	65%  { opacity: .4; }
	100% { opacity: .2; }
}

body { background: #000; }

#forest {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: url( '/assets/media/forest_bw.jpg' );
	background-size: cover;
	background-attachment: fixed;
	background-repeat: no-repeat;
	animation-name: fade;
	animation-duration: 4s;
	animation-iteration-count: infinite;
	box-shadow: inset 0 0 500px 80px #000;
	opacity: .2;
}

#orb {
	position: fixed;
	top: 50%;
	left: 50%;
	width: 200px;
	height: 200px;
	background: #EEE;
	border-radius: 360px;
	box-shadow: 0 0 10px 10px #EEE;
	animation-name: glow;
	animation-duration: 4s;
	animation-iteration-count: infinite;
	transform: translate( -50%, -50% );
}

p {
  position: fixed;
  top: 50%;
  left: 50%;
  font-size: 24px;
  font-family: 'Herr Von Muellerhoff';
  font-weight: bold;
  pointer-events: none;
  padding-bottom: 36px;
  transform: translate( -50%, -50% );
}

</style>

</head>
<body>
 

<div id="forest"></div> <a href="/" target="_self">
<div id="orb"></div> </a>
<p>Welcome to heck, nerds.</p>

</body>
</html>
